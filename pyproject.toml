[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-alm-workshop"
version = "0.1.0"
description = "AI-Q-native medical-device retirement planning workshop"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.0.5,<2",
  "mcp>=1.12,<2",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "pypdf>=6,<7",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
aiq = ["nvidia-nat[langchain,async_endpoints,mcp]==1.8.0", "deepagents>=0.6.5,<0.7"]
openshell = ["openshell==0.0.80"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-httpx>=0.35,<1",
  "ruff>=0.15,<1",
]

[project.scripts]
healthcare-alm = "healthcare_alm.cli:app"

[project.entry-points."nat.plugins"]
healthcare_alm = "healthcare_alm.aiq.register"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
healthcare_alm = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires network or external service"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
